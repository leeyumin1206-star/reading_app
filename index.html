<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221A19" media="(prefers-color-scheme: dark)">
<title>나의 서재</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --blush:#FCEEEA; --blush2:#F8D9D0; --line:#F2E7E3;
  --ink:#2E2422; --sub:#6E5F5B; --icon:#B79F98; --muted:#8C807C;
  --accent:#B5604D; --accent-ink:#FFFFFF; --soft-ink:#8E4636; --add:#E59A86;
  --star:#E08C76; --star-off:#F1DAD3; --danger:#A8382A; --shadow:rgba(214,150,130,.25);
  --font:'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221A19; --blush:#332624; --blush2:#4A3330; --line:#3B2E2C;
    --ink:#F5E9E6; --sub:#C9B3AE; --icon:#B08B83; --muted:#9E8580;
    --accent:#E8957F; --accent-ink:#221A19; --soft-ink:#F3C2B4; --add:#E59A86;
    --star:#F0A08B; --star-off:#4A3633; --danger:#F09080; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#221A19; --blush:#332624; --blush2:#4A3330; --line:#3B2E2C;
  --ink:#F5E9E6; --sub:#C9B3AE; --icon:#B08B83; --muted:#9E8580;
  --accent:#E8957F; --accent-ink:#221A19; --soft-ink:#F3C2B4; --add:#E59A86;
  --star:#F0A08B; --star-off:#4A3633; --danger:#F09080; --shadow:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}

.app{height:100%;display:flex}
.pane{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-pane{position:relative;flex:1}
.detail-pane{flex:1;position:relative}
body[data-view="home"] .detail-pane{display:none}
body:not([data-view="home"]) .list-pane{display:none}
@media (min-width:700px){
  .list-pane{flex:0 0 400px;display:block!important;border-right:1px solid var(--line)}
  .detail-pane{display:block!important}
  .back-btn{display:none!important}
}

/* home */
.brand{padding:24px 24px 0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.greet{padding:12px 24px 0}
.greet h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.greet p{margin:6px 0 0;font-size:14px;color:var(--sub)}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:24px 24px 12px;font-size:16px;font-weight:700}
.sec span{font-size:13px;font-weight:400;color:var(--sub)}
.hero-card{display:flex;flex-direction:column;justify-content:flex-end;margin:0 24px;height:148px;border-radius:20px;padding:18px 20px;color:#FFFFFF;text-align:left;border:none;width:calc(100% - 48px);background-size:cover;background-position:center;box-shadow:0 10px 24px var(--shadow)}
.hero-card b{font-size:22px;font-weight:700;text-shadow:0 1px 8px rgba(58,40,36,.3)}
.hero-card small{font-size:13px;margin-top:4px;opacity:.95}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;padding:0 24px 120px}
.tile{aspect-ratio:3/4;border-radius:16px;border:none;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#FFFFFF;text-align:left;background-size:cover;background-position:center}
.tile b{font-size:15px;font-weight:700;line-height:1.3;text-shadow:0 1px 6px rgba(58,40,36,.35);word-break:keep-all}
.tile small{font-size:11px;margin-top:3px;opacity:.92}
.rows{display:flex;flex-direction:column;gap:2px;padding:0 12px 110px}
.lrow{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:16px;border:none;background:transparent;text-align:left;width:100%}
.lrow[aria-current="true"]{background:var(--blush)}
.lthumb{width:40px;height:54px;flex-shrink:0;border-radius:10px;background-size:cover;background-position:center}
.lbody{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.lbody b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbody span{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:8px 24px;padding:28px 20px;border-radius:20px;background:var(--blush);text-align:center;color:var(--sub);font-size:15px;line-height:1.7}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
body[data-view="detail"] .nav,body[data-view="form"] .nav{display:none}
@media (min-width:700px){.nav{right:auto;width:400px;display:flex!important;border-right:1px solid var(--line)}}
.nav-item{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:var(--muted);font-size:11px}
.nav-item[aria-current="page"]{color:var(--accent)}
.nav-add{width:54px;height:54px;border-radius:27px;border:none;background:var(--add);color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px var(--shadow);margin-top:-18px}

/* stars */
.stars{position:relative;display:inline-block;line-height:1;letter-spacing:1px;white-space:nowrap;font-size:14px}
.stars-bg{color:var(--star-off)}
.stars-fg{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);width:var(--p)}

/* detail */
.dhero{height:200px;background-size:cover;background-position:center}
.back-btn{position:absolute;left:12px;top:16px;width:44px;height:44px;border:none;background:rgba(90,50,44,.22);border-radius:22px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;z-index:3;backdrop-filter:blur(6px)}
.sheet{position:relative;margin-top:-32px;background:var(--bg);border-radius:28px 28px 0 0;padding:26px 24px 32px;min-height:calc(100% - 168px);display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(214,150,130,.12)}
@media (min-width:700px){.sheet{padding:28px 40px 32px}.dhero{height:220px}}
.sheet h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.sheet .who{font-size:14px;color:var(--sub);margin:6px 0 16px}
.drow{display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid var(--line)}
.drow .ic{color:var(--icon);display:flex}
.drow .k{font-size:12px;letter-spacing:.08em;color:var(--sub);flex:1}
.drow .v{font-size:14px;display:flex;align-items:center;gap:6px}
.quote{margin-top:14px;padding:14px 16px;background:var(--blush);border-radius:14px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.quote.ph{color:var(--sub)}
.pill{height:52px;border-radius:26px;border:none;background:var(--blush2);color:var(--soft-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;width:100%;margin-top:24px}

/* form */
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 4px;position:sticky;top:0;background:var(--bg);z-index:2}
.bar h2{margin:0;font-size:18px;font-weight:700}
.text-btn{height:44px;min-width:60px;padding:0 12px;border:none;background:none;font-size:15px;color:var(--sub)}
.text-btn.strong{color:var(--accent);font-weight:700}
.form{display:flex;flex-direction:column;gap:20px;padding:16px 24px 48px;max-width:560px}
.field{display:flex;flex-direction:column;gap:8px}
.lab{font-size:12px;letter-spacing:.08em;color:var(--sub)}
.input{height:50px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:var(--blush);font-size:16px}
.input:focus{border-color:var(--add);outline:none}
textarea.input{height:auto;padding:14px 16px;resize:none;line-height:1.6}
.input[aria-invalid="true"]{border-color:var(--danger)}
.err{font-size:12px;color:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cover-edit{display:flex;gap:16px;align-items:center}
.cover-slot{width:100px;height:140px;flex-shrink:0;border-radius:16px;background:linear-gradient(180deg,#FDF3F0,#F8DED6);display:flex;align-items:center;justify-content:center;color:#C9958A;overflow:hidden}
.cover-slot img{width:100%;height:100%;object-fit:cover}
.cover-btns{display:flex;flex-direction:column;gap:10px;flex:1}
.cover-btns p{margin:0;font-size:13px;color:var(--sub);line-height:1.5}
.soft{height:42px;border-radius:21px;border:none;background:var(--blush);color:var(--soft-ink);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;background:var(--blush);border-radius:26px}
.seg button{height:42px;border:none;border-radius:21px;background:transparent;font-size:15px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 2px 8px var(--shadow)}
.rate{display:flex;gap:2px;align-items:center}
.rate button{width:48px;height:48px;border:none;background:none;padding:0;position:relative;font-size:34px;line-height:48px;text-align:center}
.rate .s-bg{color:var(--star-off)}
.rate .s-fg{position:absolute;left:0;top:0;height:100%;overflow:hidden;color:var(--star);text-align:left;width:var(--f)}
.rate .s-fg span{display:inline-block;width:48px;text-align:center}
.primary{height:54px;border:none;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(181,96,77,.25)}
.danger-btn{height:48px;border-radius:24px;border:1px solid var(--line);background:none;color:var(--danger);font-size:15px}

/* settings */
.page-title{padding:32px 24px 0}
.page-title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.group{padding:22px 24px 0;font-size:12px;letter-spacing:.08em;color:var(--sub)}
.srows{padding:6px 24px 0}
.srow{display:flex;align-items:center;gap:14px;min-height:54px;border:none;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:0}
.srow:first-child{border-top:none}
.srow .ic{color:var(--icon);display:flex}
.srow .t{font-size:15px;flex:1}
.srow .r{font-size:14px;color:var(--sub)}
.tip{margin:10px 24px 0;padding:14px 16px;background:var(--blush);border-radius:14px;font-size:13px;line-height:1.6;color:var(--sub)}
.placeholder-pane{height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;padding:32px;text-align:center}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(40,25,22,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal-box{background:var(--bg);border-radius:20px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:18px}
.modal-box p{margin:0;font-size:15px;line-height:1.6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{height:44px;padding:0 18px;border-radius:22px;border:none;background:var(--blush);font-size:15px}
.modal-actions .ok{background:var(--accent);color:var(--accent-ink)}
.modal-actions .ok.warn{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

/* v2.1: readable titles, uncropped covers */
.cv{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 6px 14px rgba(60,35,30,.18);flex-shrink:0;background:var(--blush)}
.cv img{display:block;width:100%;height:100%;object-fit:contain}
.gen{display:flex;flex-direction:column;padding:12% 11%;gap:6px;box-shadow:inset 4px 0 0 rgba(0,0,0,.14),0 6px 14px rgba(60,35,30,.18)}
.gen .gb{width:28%;height:2px;flex-shrink:0}
.gen b{font-weight:700;line-height:1.25;word-break:keep-all}
.gen small{margin-top:auto;opacity:.85;letter-spacing:.06em}
.cv-tile{width:100%;aspect-ratio:3/4}.cv-tile.gen b{font-size:14px}.cv-tile.gen small{font-size:10px}
.cv-hero{width:72px;height:104px}.cv-hero.gen b{font-size:10px}.cv-hero.gen small{font-size:8px}
.cv-row{width:40px;height:56px;border-radius:5px}.cv-row.gen b,.cv-row.gen small,.cv-row.gen .gb{display:none}
.cv-form{width:104px;height:150px;border-radius:8px}.cv-form.gen b{font-size:13px}.cv-form.gen small{font-size:9px}
.cv-detail{height:178px;border-radius:8px}.cv-detail img{width:auto;max-width:260px;height:178px}.cv-detail.gen{width:124px}.cv-detail.gen b{font-size:15px}.cv-detail.gen small{font-size:10px}
.recent{margin:0 24px;display:flex;gap:16px;align-items:center;padding:14px;background:var(--blush);border-radius:20px;border:none;width:calc(100% - 48px);text-align:left;color:var(--ink)}
.recent .rb{display:flex;flex-direction:column;gap:5px;min-width:0}
.recent .rt{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .rs{font-size:14px;color:var(--sub)}
.recent .rr{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:14px;font-weight:700}
.shelf{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 14px}
.book{display:flex;flex-direction:column;gap:6px;border:none;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.book b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book small{font-size:12px;color:var(--sub);margin-top:-3px}
.dtop{position:relative;height:236px;background:linear-gradient(180deg,var(--blush) 0%,var(--blush2) 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px}
.dtop .back-btn{background:transparent;color:var(--ink);backdrop-filter:none}
.dbody{padding:20px 24px 32px;display:flex;flex-direction:column}
@media (min-width:700px){.dbody{padding:24px 40px 32px}}
.dbody h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center;word-break:keep-all}
.dbody .who{font-size:14px;color:var(--sub);margin:6px 0 14px;text-align:center}
.drow .k{font-size:14px;letter-spacing:0}
.drow .v{font-size:15px;font-weight:500}
.dbody .pill{background:var(--accent);color:var(--accent-ink)}
.input{background:var(--bg);border:1.5px solid #EAD9D3}
:root[data-theme="dark"] .input{border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .input{border-color:var(--line)}}
.lab{font-size:14px;letter-spacing:0;font-weight:500}
.nav-add{background:var(--accent);color:var(--accent-ink)}
.nav-item[aria-current="page"]{font-weight:700}
</style>
</head>
<body data-view="home">
<div class="app">
  <aside class="pane list-pane" id="listPane"></aside>
  <main class="pane detail-pane" id="detailPane"></main>
</div>
<nav class="nav" id="nav" aria-label="메뉴"></nav>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galInput" accept="image/*" class="hidden">
<input type="file" id="importInput" accept=".json,application/json" class="hidden">
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ---------- storage (IndexedDB) — unchanged from v1 so existing records stay ---------- */
const DB_NAME = 'reading-log', STORE = 'books';
let dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(STORE, { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const s = t.objectStore(STORE);
    let out;
    const r = fn(s);
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbPut = b => tx('readwrite', s => s.put(b));
const dbDel = id => tx('readwrite', s => s.delete(id));
async function dbReplaceAll(list){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readwrite');
    const s = t.objectStore(STORE);
    s.clear();
    list.forEach(b => s.put(b));
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
  });
}
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- state ---------- */
const OWNER = '유민';
let books = [];
let state = { view: 'home', id: null };
let depth = 0;
let draft = null;
let dl = null;
const wideMQ = window.matchMedia('(min-width: 700px)');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? d.replace(/-/g, '.') : '';
const today = () => { const d = new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const rateText = r => r ? Number(r).toFixed(1) : '';

const COVERS = [
  ['#2F4A3A','#F3EBDD','#C9A86A'], ['#F1E4C8','#3B2C22','#D2693C'], ['#1F2D4A','#F4E3C1','#E3B04B'],
  ['#E9E4DA','#2A2A2A','#8B1E2D'], ['#6B3A44','#F6E7E2','#E9B7A8'], ['#DDE6E1','#24342D','#4F7A65']
];
function pal(title){ let h = 0; for (const c of String(title)) h = (h * 31 + c.codePointAt(0)) >>> 0; return COVERS[h % COVERS.length]; }
function coverHTML(b, cls){
  if (b.cover) return `<span class="cv ${cls}"><img src="${esc(b.cover)}" alt="" loading="lazy"></span>`;
  const [bg, ink, acc] = pal(b.title);
  return `<span class="cv gen ${cls}" style="background:${bg};color:${ink}" aria-hidden="true"><span class="gb" style="background:${acc}"></span><b>${esc(b.title)}</b><small>${esc(b.author || '')}</small></span>`;
}
function starsHTML(r, size){
  const p = (Math.max(0, Math.min(5, r || 0)) / 5 * 100) + '%';
  return `<span class="stars" style="--p:${p};${size ? 'font-size:' + size + 'px' : ''}" role="img" aria-label="별점 ${r || 0}점"><span class="stars-bg">★★★★★</span><span class="stars-fg">★★★★★</span></span>`;
}
const byCreated = () => books.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
function latestDone(){
  const done = books.filter(b => b.end).sort((a, b) => b.end.localeCompare(a.end) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  return done[0] || byCreated()[0] || null;
}

const SVG = {
  home:'<path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',

async function saveDraft(){
  const d = draft;
  d.title = (d.title || '').trim();
  if (!d.title){
    const t = $('f-title'); t.setAttribute('aria-invalid', 'true'); $('titleErr').classList.remove('hidden'); t.focus();
    return;
  }
  const now = new Date().toISOString();
  const b = { id: d.id || uid(), title: d.title, author: (d.author || '').trim(), publisher: (d.publisher || '').trim(), format: d.format || '종이책', cover: d.cover || null, start: d.start || '', end: d.end || '', rating: d.rating || 0, review: (d.review || '').trim(), createdAt: d.createdAt || now, updatedAt: now };
  try { await dbPut(b); } catch(e){ toast('저장하지 못했어요. 폰 저장 공간을 확인하세요.'); return; }
  await reload();
  draft = null;
  state = { view: 'detail', id: b.id };
  try { history.replaceState(state, ''); } catch(e){}
  render();
  $('detailPane').scrollTop = 0;
  toast('저장했어요.');
}
function readImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 800;
      let { width: w, height: h } = img;
      const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
async function onCoverFile(e){

async function exportBackup(){
  const all = await dbAll();
  const data = JSON.stringify({ app: 'reading-log', version: 1, exportedAt: new Date().toISOString(), books: all }, null, 1);
  const filename = `독서기록-백업-${today()}.json`;
  if (dl){
    try { await dl.save({ filename, data }); lsSet('lastBackup', today()); render(); toast('백업 파일을 저장했어요.'); }
    catch(e){ if (e && e.code === 'declined') return; toast('백업 파일을 저장하지 못했어요.'); }
    return;
  }
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  lsSet('lastBackup', today()); render();
  toast('백업 파일을 다운로드 폴더에 저장했어요.');
}
async function onImportFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let parsed;
  try { parsed = JSON.parse(await f.text()); } catch(err){ toast('백업 파일을 읽지 못했어요. 이 앱에서 내보낸 .json 파일인지 확인하세요.'); return; }
  const list = parsed && Array.isArray(parsed.books) ? parsed.books.filter(b => b && b.id && b.title) : null;
  if (!list){ toast('이 파일에는 독서 기록이 없어요.'); return; }
  const ok = await confirmBox(`백업 파일의 책 ${list.length}권으로 지금 기록(${books.length}권)을 바꿀까요? 지금 기록은 사라져요.`, '불러오기', true);
  if (!ok) return;
  try { await dbReplaceAll(list); } catch(err){ toast('불러오지 못했어요. 폰 저장 공간을 확인하세요.'); return; }
  await reload(); render(); toast(`책 ${list.length}권을 불러왔어요.`);
}

/* ---------- modal & toast ---------- */
let modalResolve = null;
function confirmBox(msg, okText, warn){
  return new Promise(res => {
    modalResolve = res;
    $('modalRoot').innerHTML = `<div class="modal" data-act="modal-bg"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mMsg"><p id="mMsg">${esc(msg)}</p><div class="modal-actions"><button data-act="modal-no">취소</button><button class="ok${warn ? ' warn' : ''}" data-act="modal-yes">${esc(okText)}</button></div></div></div>`;
    const y = document.querySelector('[data-act="modal-yes"]'); if (y) y.focus();
  });
}
function closeModal(v){
  $('modalRoot').innerHTML = '';
  if (modalResolve){ const r = modalResolve; modalResolve = null; r(!!v); }
}
let toastTimer = null;
function toast(msg){
  let t = document.querySelector('.toast');
  if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act){
    case 'open': go('detail', el.dataset.id, !(wideMQ.matches && state.view === 'detail')); break;
    case 'home':
      if (state.view === 'home') { $('listPane').scrollTop = 0; break; }
      state = { view: 'home', id: null }; try { history.pushState(state, ''); depth++; } catch(err){} render(); break;
    case 'add': go('form', null); break;
    case 'edit': go('form', el.dataset.id); break;
    case 'settings': if (state.view !== 'settings') go('settings', null); break;
    case 'back': back(); break;
    case 'cancel': draft = null; back(); break;
    case 'save': captureInputs(); await saveDraft(); break;
    case 'cam': captureInputs(); $('camInput').click(); break;
    case 'gal': captureInputs(); $('galInput').click(); break;
    case 'nocover': captureInputs(); draft.cover = null; renderForm($('detailPane')); break;
    case 'fmt':
      draft.format = el.dataset.v;
      document.querySelectorAll('[data-act="fmt"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === draft.format)));
      break;
    case 'star': {
      const i = Number(el.dataset.i);
      let v = i;
      if (e.detail !== 0){ const r = el.getBoundingClientRect(); if (e.clientX - r.left < r.width / 2) v = i - 0.5; }
      if (v === draft.rating) v = 0;
      setRating(v);
      break;
    }
    case 'delete': {
      const ok = await confirmBox(`'${draft.title}' 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.`, '삭제', true);
      if (!ok) return;
      await dbDel(draft.id); await reload(); draft = null;
      state = { view: 'home', id: null };
      try { history.replaceState(state, ''); } catch(err){}
      render(); toast('삭제했어요.');
      break;
    }
    case 'export': exportBackup(); break;
    case 'import': $('importInput').click(); break;
    case 'modal-yes': closeModal(true); break;
    case 'modal-no': closeModal(false); break;
    case 'modal-bg': if (e.target === el) closeModal(false); break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k && draft){
    draft[k] = e.target.value;
    if (k === 'title' && e.target.value.trim()){ e.target.removeAttribute('aria-invalid'); const er = $('titleErr'); if (er) er.classList.add('hidden'); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalResolve) closeModal(false); });
$('camInput').addEventListener('change', onCoverFile);
$('galInput').addEventListener('change', onCoverFile);
$('importInput').addEventListener('change', onImportFile);

(async function start(){
  try { history.replaceState(state, ''); } catch(e){}
  await reload();
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  const hookClaude = () => {
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(x => { dl = x; }).catch(() => {});
      return true;
    }
    return false;
  };
  if (!hookClaude()) setTimeout(hookClaude, 800);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
